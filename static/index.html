<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Buying Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1d2e;
            padding: 16px 24px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        header span { font-size: 1.5rem; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .message.user {
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #1e2130;
            border: 1px solid #2d3748;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .sources {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .input-area {
            padding: 16px 24px;
            background: #1a1d2e;
            border-top: 1px solid #2d3748;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #2d3748;
            background: #0f1117;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
        }
        .input-area input:focus { border-color: #2563eb; }
        .input-area button {
            padding: 12px 24px;
            border-radius: 24px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .input-area button:hover { background: #1d4ed8; }
        .input-area button:disabled { background: #374151; cursor: not-allowed; }
        .typing { opacity: 0.6; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <span>🚗</span>
        <h1>Car Buying Assistant</h1>
    </header>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Ask about cars, prices, comparisons..." autocomplete="off">
        <button id="send">Send</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        let chatHistory = [];

        function addMessage(text, role, sources = []) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            if (sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.textContent = '📎 Sources: ' + sources.map(s => `${s.source} (${s.page})`).join(', ');
                div.appendChild(srcDiv);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            addMessage(query, 'user');
            sendBtn.disabled = true;

            // Show typing indicator
            const typing = document.createElement('div');
            typing.className = 'message assistant typing';
            typing.textContent = 'Thinking...';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, chat_history: chatHistory, top_k: 6 })
                });

                if (!res.ok) throw new Error(`Error: ${res.status}`);
                const data = await res.json();

                typing.remove();
                addMessage(data.answer, 'assistant', data.sources);

                chatHistory.push({ role: 'user', content: query });
                chatHistory.push({ role: 'assistant', content: data.answer });
                // Keep last 8 turns
                if (chatHistory.length > 16) chatHistory = chatHistory.slice(-16);
            } catch (err) {
                typing.remove();
                addMessage('Sorry, something went wrong. Please try again.', 'assistant');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        input.focus();
    </script>
</body>
</html>
